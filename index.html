"🇦🇹 Austria<br><br>\
<b>📍 Informacion i përgjithshëm:</b><br>\
Kryeqyteti: Vjena<br>\
Popullsia: rreth 9 milion banorë<br>\
Gjuha zyrtare: gjermanishtja<br>\
Monedha: euro (€)<br>\
Sistemi politik: republikë federale<br><br>\

<b>🌍 Pozicioni gjeografik:</b><br>\
Austria ndodhet në Evropën Qendrore dhe kufizohet me Gjermaninë, Çekinë, Sllovakinë, Hungarinë, Slloveninë, Italinë, Zvicrën dhe Lihtenshtajnin. Është vend pa dalje në det dhe dominohet nga Alpet.<br><br>\

<b>🏛️ Historia:</b><br>\
Austria ka qenë pjesë e Perandorisë Austro-Hungareze. Pas Luftës së Parë Botërore, ajo u shpërbë dhe Austria u bë shtet i pavarur.<br><br>\

<b>🎼 Kultura dhe arti:</b><br>\
Austria është vendi i muzikës klasike. Këtu kanë jetuar kompozitorë të mëdhenj si Mozart, Beethoven dhe Johann Strauss. Vjena është një nga qendrat më të rëndësishme kulturore në botë.<br><br>\

<b>💰 Ekonomia:</b><br>\
Austria ka ekonomi shumë të zhvilluar me industri të fortë, turizëm të zhvilluar (sidomos ski) dhe sektor shërbimesh modern.<br><br>\

<b>🏔️ Turizmi:</b><br>\
Atraksionet kryesore përfshijnë Alpet Austriake, Pallatin Schönbrunn dhe Katedralen e Shën Stefanit në Vjenë.<br><br>\

<b>🇪🇺 Marrëdhëniet ndërkombëtare:</b><br>\
Austria është anëtare e Bashkimit Europian që nga viti 1995 dhe njihet për neutralitetin e saj politik."
]
countries.forEach(function(country) {
    var marker = L.marker([country[1], country[2]]).addTo(map);

    marker.bindPopup(country[3]);

    marker.on('click', function() {
        document.getElementById("panel").innerHTML = country[3];
    });
});
