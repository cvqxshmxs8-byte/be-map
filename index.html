<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EU Guide ULTRA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont;
background:#e9eef5;
overflow:hidden;
}

/* HEADER /
header{
background:rgba(30,58,95,0.9);
color:white;
padding:15px;
text-align:center;
backdrop-filter:blur(10px);
}

/ MAP /
#map{height:50vh}

/ BOTTOM PANEL (IPHONE STYLE) /
#panel{
position:fixed;
bottom:0;
left:0;
width:100%;
height:40%;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(20px);
border-radius:20px 20px 0 0;
padding:15px;
overflow:auto;
transform:translateY(100%);
transition:0.4s;
}

/ ACTIVE PANEL /
#panel.active{
transform:translateY(0);
}

/ CARD /
.card{
background:white;
padding:12px;
margin-top:10px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/ TABS /
.tabs{
display:flex;
gap:5px;
margin-top:10px;
}

.tabs button{
flex:1;
padding:8px;
border:none;
border-radius:10px;
background:#ddd;
}

.tabs button.active{
background:#1e3a5f;
color:white;
}

/ SEARCH FLOAT /
#search{
position:absolute;
top:70px;
left:10px;
width:200px;
padding:8px;
border-radius:10px;
border:none;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>🇪🇺 EU Guide</header>

<input id="search" placeholder="Kërko...">

<div id="map"></div>

<div id="panel"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([50,10],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

/ TAB SWITCH /
function showTab(id){
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById(id).style.display='block';
event.target.classList.add('active');
}

/ PAGE /
function page(c){
return <h2>${c.flag} ${c.name}</h2>  <img src="${c.img}" width="100%" style="border-radius:12px">  <div class="tabs"> <button class="active" onclick="showTab('info')">Info</button> <button onclick="showTab('eco')">Ekonomi</button> <button onclick="showTab('cul')">Kulturë</button> </div>  <div id="info" class="tab"> <div class="card">Kryeqyteti: ${c.capital}</div> <div class="card">Popullsia: ${c.population}</div> </div>  <div id="eco" class="tab" style="display:none"> <div class="card">${c.economy}</div> </div>  <div id="cul" class="tab" style="display:none"> <div class="card">${c.culture}</div> </div>;
}

/ DATA /
var countries = [

{name:"Sllovenia",lat:46.0569,lng:14.5058,flag:"🇸🇮",img:"https://flagcdn.com/w320/si.png",capital:"Lubjanë",population:"2.1M",economy:"E qëndrueshme, turizëm.",culture:"Alpe + Adriatik."},
{name:"Spanja",lat:40.4168,lng:-3.7038,flag:"🇪🇸",img:"https://flagcdn.com/w320/es.png",capital:"Madrid",population:"48M",economy:"Turizëm, shërbime.",culture:"Flamenco, sport."},
{name:"Suedia",lat:59.3293,lng:18.0686,flag:"🇸🇪",img:"https://flagcdn.com/w320/se.png",capital:"Stokholm",population:"10.5M",economy:"Inovacion, teknologji.",culture:"Dizajn nordik, mirëqenie."}
];

/ SHOW PANEL /
function page(c){
return `
<h2 style="margin:5px 0">${c.flag} ${c.name}</h2>

<img src="${c.img}" width="100%" style="border-radius:12px">

<div class="tabs">
<button class="active" onclick="showTab('info')">Përmbledhje</button>
<button onclick="showTab('eco')">Ekonomia</button>
<button onclick="showTab('cul')">Kultura</button>
</div>

<div id="info" class="tab">
<div class="card"><b>Kryeqyteti:</b> ${c.capital}</div>
<div class="card"><b>Popullsia:</b> ${c.population}</div>
<div class="card">Shtet anëtar i BE me rol të rëndësishëm në rajon.</div>
</div>

<div id="eco" class="tab" style="display:none">
<div class="card">${c.economy}</div>
</div>

<div id="cul" class="tab" style="display:none">
<div class="card">${c.culture}</div>
</div>
`;
}

/ MARKERS /
countries.forEach(c=>{
L.marker([c.lat,c.lng]).addTo(map)
.on('click',()=>openPanel(c));
});

/ SEARCH */
document.getElementById("search").oninput=function(){
let v=this.value.toLowerCase();
let found=countries.find(c=>c.name.toLowerCase().includes(v));
if(found) openPanel(found);
};
</script>

</body>
</html>
