<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BE Guide</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

h1{
  background:#1e3a5f;
  color:white;
  padding:15px;
  margin:0;
  text-align:center;
}

#map{ height:60vh; }

#panel{
  padding:20px;
  background:#f5f5f5;
}

.card{
  background:white;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
</style>
</head>

<body>

<h1>Bashkimi Europian - 27 Shtetet</h1>

<div id="map"></div>

<div id="panel">
  <h2>Kliko një shtet</h2>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([50,10],4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var countries = [

["Franca",48.8566,2.3522,`
<h2>🇫🇷 Franca</h2>

<img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Eiffel_Tower.jpg" width="100%">

<div class="card">
<b>Kryeqyteti:</b> Paris<br>
<b>Popullsia:</b> ~68 milion<br>
<b>Gjuha:</b> Frëngjisht
</div>

<div class="grid">
<div class="card"><b>Ekonomia</b><br>Franca është ndër ekonomitë më të mëdha në botë.</div>
<div class="card"><b>Kultura</b><br>Art, modë, muze si Louvre.</div>
<div class="card"><b>Turizmi</b><br>Mbi 90 milion turistë çdo vit.</div>
<div class="card"><b>Historia</b><br>Revolucioni Francez dhe ndikim global.</div>
</div>

<div class="card">
<b>Fakte:</b><br>
- Ka mbi 1500 lloje djathi<br>
- Paris = qyteti i dashurisë<br>
- Një nga vendet themeluese të BE
</div>
`],

["Gjermania",52.52,13.405,`
<h2>🇩🇪 Gjermania</h2>

<div class="card">
Kryeqyteti: Berlin<br>
Ekonomia më e fortë në Europë.
</div>
`]

];

countries.forEach(c=>{
  L.marker([c[1],c[2]]).addTo(map)
  .on('click', function(){
    document.getElementById("panel").innerHTML = c[3];
  });
});

</script>

</body>
</html>
