<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8" />
<title>Bashkimi Europian</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:-apple-system,sans-serif; background:#0f172a; color:white; }
header { padding:15px; text-align:center; font-size:24px; font-weight:bold; background:linear-gradient(90deg,#2563eb,#1e3a8a);}
.container { display:flex; }
#map { height:calc(100vh - 60px); width:70%; }
#panel { width:30%; padding:20px; background:#111827; overflow:auto; }
.card { background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; }
.section { margin-top:12px; }
.section b { color:#60a5fa; }
</style>
</head>

<body>

<header>🌍 Bashkimi Europian - Harta Interaktive</header>

<div class="container">
<div id="map"></div>
<div id="panel">
<div class="card">
<h2>Kliko një shtet</h2>
<p>Paneli do mbushet me informacion të plotë.</p>
</div>
</div>
</div>

<script>
var map = L.map('map').setView([54,15],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function info(n,f,y,c,p,l,m,g,e,cu){
return f+" <h2>"+n+"</h2>"
+"<div class='section'><b>📅 Anëtarësimi:</b> "+y+"</div>"
+"<div class='section'><b>📍 Kryeqyteti:</b> "+c+"</div>"
+"<div class='section'><b>👥 Popullsia:</b> "+p+"</div>"
+"<div class='section'><b>🗣️ Gjuha:</b> "+l+"</div>"
+"<div class='section'><b>💰 Monedha:</b> "+m+"</div>"
+"<div class='section'><b>🌍 Gjeografia:</b><br>"+g+"</div>"
+"<div class='section'><b>💼 Ekonomia:</b><br>"+e+"</div>"
+"<div class='section'><b>🎭 Kultura:</b><br>"+cu+"</div>";
}

"Vend alpin me male dhe natyrë të bukur.",

  var marker = L.marker([c[1],c[2]]).addTo(map);
  marker.on('click', function(){
    document.getElementById("panel").innerHTML =
    "<div class='card'>"+c[3]+"</div>";

</script>

</body>
</html>
