<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BE Guide</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

h1{
  background:#1e3a5f;
  color:white;
  padding:15px;
  margin:0;
  text-align:center;
}

#map{ height:60vh; }

#panel{
  padding:20px;
  background:#f5f5f5;
}

.card{
  background:white;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
</style>
</head>

<body>

    marker.bindPopup(country[3]);

    marker.on('click', function() {
        document.getElementById("panel").innerHTML = country[3];
    });
