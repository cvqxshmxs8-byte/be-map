<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BE Guide</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }

h1{
  background:#1e3a5f;
  color:white;
  padding:15px;
  margin:0;
  text-align:center;
}

#map{ height:60vh; }

#panel{
  padding:20px;
  background:#f5f5f5;
}

.card{
  background:white;
  padding:15px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
</style>
</head>

<body>

<h1>Bashkimi Europian - 27 Shtetet</h1>

<div id="map"></div>

<div id="panel">
  <h2>Kliko një shtet</h2>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([50,10],4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

["Finlanda",60.1699,24.9384,"<img src='https://flagcdn.com/w40/fi.png'> <b>Finlanda</b><br>Kryeqyteti: Helsinki<br>Arsim i fortë dhe natyrë e pastër."],

["Hungaria",47.4979,19.0402,"<img src='https://flagcdn.com/w40/hu.png'> <b>Hungaria</b><br>Kryeqyteti: Budapesti<br>Danubi dhe arkitekturë historike."],

["Irlanda",53.3498,-6.2603,"<img src='https://flagcdn.com/w40/ie.png'> <b>Irlanda</b><br>Kryeqyteti: Dublini<br>Ekonomi teknologjike dhe kulturë keltike."],

["Suedia",59.3293,18.0686,"<img src='https://flagcdn.com/w40/se.png'> <b>Suedia</b><br>Kryeqyteti: Stokholm<br>Teknologji dhe standard i lartë jetese."]

countries.forEach(c=>{
  L.marker([c[1],c[2]]).addTo(map)
  .on('click', function(){
    document.getElementById("panel").innerHTML = c[3];
  });
});

</script>

</body>
</html>
